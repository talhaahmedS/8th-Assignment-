<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Designs Assignment</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 60px;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* ==========================================
           DESIGN 1: FLOATING DARK PILL NAVBAR 
           ========================================== */
        .design-1-wrapper {
            background-color: #f3f4f6;
            padding: 60px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dark-pill-nav {
            background-color: #1e2025;
            padding: 8px 10px 8px 12px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .pill-logo {
            width: 36px;
            height: 36px;
            background-color: #2a2d34;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }

        .pill-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .pill-links a {
            color: #a0a5b1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .pill-links a:hover {
            color: #ffffff;
        }

        .pill-email-btn {
            background-color: #ffffff;
            color: #1e2025;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .pill-email-btn:hover {
            opacity: 0.9;
        }

        /* ==========================================
           DESIGN 2: BLUE GLASSMORPHIC NAVBAR
           ========================================== */
        .design-2-wrapper {
            background: linear-gradient(135deg, #0b4bb2, #1062e2);
            padding: 50px 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .design-2-heading {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .blue-nav-desktop {
            width: 100%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 10px 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
        }

        .logo-dot {
            width: 22px;
            height: 22px;
            background-color: #38bdf8;
            border-radius: 50%;
        }

        .blue-nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .blue-nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .blue-signup-btn {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .blue-nav-mobile {
            width: 100%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 12px 20px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-icon {
            font-size: 20px;
            color: #ffffff;
            cursor: pointer;
        }

        /* ==========================================
           DESIGN 3: SHADCN CLEAN MINIMAL NAVBAR
           ========================================== */
        .design-3-wrapper {
            background-color: #f9fafb;
            color: #111827;
            padding: 40px 20px 100px 20px;
            border-radius: 12px;
        }

        .shadcn-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .shadcn-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
            color: #000;
            text-decoration: none;
        }

        .shadcn-brand-icon {
            width: 18px;
            height: 18px;
            background-color: #000;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }

        .shadcn-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .shadcn-links a {
            color: #4b5563;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .shadcn-links a i {
            font-size: 10px;
        }

        .shadcn-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .shadcn-login {
            color: #111827;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
        }

        .shadcn-signup {
            background-color: #0f172a;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 6px;
        }

        /* Responsive Breakpoint */
        @media (max-width: 650px) {
            .pill-links, .blue-nav-links, .shadcn-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- DESIGN 1 -->
    <div class="container">
        <div class="design-1-wrapper">
            <nav class="dark-pill-nav">
                <div class="pill-logo">
                    <i class="fa-solid fa-cloud"></i>
                </div>
                <ul class="pill-links">
                    <li><a href="#">Work</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Playground</a></li>
                    <li><a href="#">Resource</a></li>
                </ul>
                <a href="mailto:ihyaet@gmail.com" class="pill-email-btn">ihyaet@gmail.com</a>
            </nav>
        </div>
    </div>

    <!-- DESIGN 2 -->
    <div class="container">
        <div class="design-2-wrapper">
            <h1 class="design-2-heading">20 CSS Responsive Navbar Designs</h1>
            
            <!-- Desktop Navbar -->
            <nav class="blue-nav-desktop">
                <div class="brand-logo">
                    <div class="logo-dot"></div>
                    <span>Flow</span>
                </div>
                <ul class="blue-nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Product</a></li>
                    <li><a href="#">Docs</a></li>
                    <li><a href="#">Blog</a></li>
                </ul>
                <button class="blue-signup-btn">Sign up</button>
            </nav>

            <!-- Mobile Navbar Preview -->
            <nav class="blue-nav-mobile">
                <div class="brand-logo">
                    <div class="logo-dot"></div>
                    <span>Flow</span>
                </div>
                <div class="menu-icon">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>
        </div>
    </div>

    <!-- DESIGN 3 -->
    <div class="container">
        <div class="design-3-wrapper">
            <nav class="shadcn-nav">
                <a href="#" class="shadcn-brand">
                    <div class="shadcn-brand-icon"></div>
                    <span>Shadcnblocks.com</span>
                </a>
                <ul class="shadcn-links">
                    <li><a href="#">Products <i class="fa-solid fa-chevron-down"></i></a></li>
                    <li><a href="#">Company <i class="fa-solid fa-chevron-down"></i></a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
                <div class="shadcn-actions">
                    <a href="#" class="shadcn-login">Log in</a>
                    <a href="#" class="shadcn-signup">Sign up</a>
                </div>
            </nav>
        </div>
    </div>

</body>
</html>
